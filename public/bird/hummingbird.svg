<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="100%" height="100%">
  <defs>
    <!-- Iridescent Body Gradients inspired by blue/emerald hummingbird -->
    <linearGradient id="bodyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0984e3"/>
      <stop offset="40%" stop-color="#00cec9"/>
      <stop offset="80%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#55efc4"/>
    </linearGradient>

    <linearGradient id="headGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a8ff"/>
      <stop offset="60%" stop-color="#00cec9"/>
      <stop offset="100%" stop-color="#81ecec"/>
    </linearGradient>

    <linearGradient id="throatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c40c6"/>
      <stop offset="50%" stop-color="#575fcf"/>
      <stop offset="100%" stop-color="#8c7ae6"/>
    </linearGradient>

    <linearGradient id="wingGradNear" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f3542"/>
      <stop offset="35%" stop-color="#57606f"/>
      <stop offset="70%" stop-color="#747d8c"/>
      <stop offset="100%" stop-color="#a4b0be"/>
    </linearGradient>

    <linearGradient id="wingGradFar" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e272e"/>
      <stop offset="50%" stop-color="#485460"/>
      <stop offset="100%" stop-color="#808e9b"/>
    </linearGradient>

    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0984e3"/>
      <stop offset="50%" stop-color="#2f3542"/>
      <stop offset="100%" stop-color="#1e272e"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* Built-in high-speed CSS wing flap animation */
    @keyframes flapNear {
      0% {
        transform: rotate(0deg) scaleY(1);
      }
      50% {
        transform: rotate(-38deg) scaleY(0.68) skewX(-14deg);
      }
      100% {
        transform: rotate(26deg) scaleY(1.08) skewX(10deg);
      }
    }

    @keyframes flapFar {
      0% {
        transform: rotate(0deg) scaleY(1);
      }
      50% {
        transform: rotate(-32deg) scaleY(0.72) skewX(-12deg);
      }
      100% {
        transform: rotate(22deg) scaleY(1.04) skewX(8deg);
      }
    }

    #wing-near {
      transform-origin: 82px 86px;
      animation: flapNear 0.11s ease-in-out infinite alternate;
      will-change: transform;
    }

    #wing-far {
      transform-origin: 76px 82px;
      animation: flapFar 0.11s ease-in-out infinite alternate 0.015s;
      will-change: transform;
    }
  </style>

  <!-- Far Wing Group (Background) -->
  <g id="wing-far">
    <!-- Feathers fan -->
    <path d="M 76 82 C 60 55 45 35 30 18 C 38 32 46 50 56 68 Z" fill="url(#wingGradFar)" opacity="0.9"/>
    <path d="M 76 82 C 65 52 52 28 38 12 C 48 30 58 52 66 74 Z" fill="url(#wingGradFar)" opacity="0.85"/>
    <path d="M 76 82 C 70 48 60 22 48 6 C 58 26 70 52 74 78 Z" fill="url(#wingGradFar)" opacity="0.95"/>
    <path d="M 76 82 C 78 45 74 20 62 2 C 72 24 82 50 78 80 Z" fill="url(#wingGradFar)"/>
    <path d="M 76 82 C 84 48 85 24 76 4 C 84 28 88 54 82 82 Z" fill="url(#wingGradFar)"/>
  </g>

  <!-- Tail Feathers -->
  <g id="tail">
    <path d="M 85 142 C 82 165 78 185 70 196 C 76 182 85 162 90 144 Z" fill="url(#tailGrad)"/>
    <path d="M 89 140 C 90 162 90 186 86 198 C 91 184 96 162 96 140 Z" fill="url(#tailGrad)"/>
    <path d="M 94 138 C 98 160 102 182 104 195 C 102 178 99 158 97 136 Z" fill="url(#tailGrad)"/>
    <!-- Central long spine -->
    <path d="M 90 142 L 85 197" stroke="#1e272e" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Main Body & Head -->
  <g id="body">
    <!-- Back flank & belly -->
    <path d="M 82 86 C 68 100 70 125 84 142 C 96 140 110 130 116 114 C 122 98 118 84 104 80 Z" fill="url(#bodyGrad)"/>
    
    <!-- Fluffy white down/undertail coverts -->
    <path d="M 82 130 C 80 138 82 144 88 143 C 94 142 98 136 96 128 C 92 126 86 126 82 130 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="86" cy="136" r="3" fill="#ecf0f1" opacity="0.8"/>
    
    <!-- Chest / Breast -->
    <path d="M 100 80 C 118 82 126 95 120 115 C 114 128 102 136 92 138 C 105 128 112 110 106 95 C 104 88 102 84 100 80 Z" fill="#00cec9" opacity="0.75" filter="url(#subtleGlow)"/>

    <!-- Throat / Gorget (royal violet sheen) -->
    <path d="M 112 78 C 125 80 134 88 130 96 C 124 102 116 102 110 94 Z" fill="url(#throatGrad)"/>
    
    <!-- Head -->
    <path d="M 104 78 C 108 64 122 60 134 64 C 142 68 145 76 142 84 C 136 90 120 90 110 82 Z" fill="url(#headGrad)"/>

    <!-- Sharp Hummingbird Beak (Long, slender, needle-like, pointing RIGHT) -->
    <path d="M 141 72 Q 170 75 212 78 Q 170 78 141 76 Z" fill="#1e272e"/>
    <path d="M 142 74 L 210 78" stroke="#000000" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Eye (Glint & depth) -->
    <circle cx="128" cy="71" r="4.5" fill="#1e272e"/>
    <circle cx="128" cy="71" r="3.2" fill="#000000"/>
    <circle cx="126.8" cy="69.8" r="1.3" fill="#ffffff"/>

    <!-- Subtle feathered plumage texture lines -->
    <path d="M 115 82 Q 120 86 118 90" stroke="#81ecec" stroke-width="0.8" fill="none" opacity="0.7"/>
    <path d="M 118 80 Q 124 84 121 88" stroke="#81ecec" stroke-width="0.8" fill="none" opacity="0.7"/>
    <path d="M 98 94 Q 106 102 102 112" stroke="#55efc4" stroke-width="0.8" fill="none" opacity="0.5"/>
    <path d="M 92 102 Q 100 110 96 120" stroke="#55efc4" stroke-width="0.8" fill="none" opacity="0.5"/>
  </g>

  <!-- Near Wing Group (Foreground) -->
  <g id="wing-near">
    <!-- Layered Primary & Secondary Feathers -->
    <path d="M 82 86 C 68 56 50 32 32 10 C 44 26 58 50 70 74 Z" fill="url(#wingGradNear)" opacity="0.95"/>
    <path d="M 82 86 C 75 52 60 26 44 4 C 56 22 70 48 78 76 Z" fill="url(#wingGradNear)"/>
    <path d="M 82 86 C 82 48 72 20 58 0 C 70 20 84 48 85 78 Z" fill="url(#wingGradNear)"/>
    <path d="M 82 86 C 90 50 86 24 74 2 C 84 24 94 52 89 82 Z" fill="url(#wingGradNear)"/>
    <path d="M 82 86 C 98 55 98 32 88 12 C 95 32 100 58 92 84 Z" fill="url(#wingGradNear)"/>
    <path d="M 82 86 C 104 64 108 42 102 24 C 104 42 104 64 94 86 Z" fill="url(#wingGradNear)" opacity="0.9"/>
    
    <!-- Feather spine highlights -->
    <path d="M 82 86 L 60 3" stroke="#dfe4ea" stroke-width="0.9" opacity="0.5"/>
    <path d="M 82 86 L 46 8" stroke="#dfe4ea" stroke-width="0.8" opacity="0.4"/>
    <path d="M 82 86 L 75 5" stroke="#dfe4ea" stroke-width="0.8" opacity="0.4"/>

    <!-- Wing Coverts / Shoulder with iridescent blue cap -->
    <path d="M 80 84 C 74 80 76 74 84 76 C 90 78 92 84 88 88 Z" fill="#00cec9" opacity="0.85"/>
  </g>

  <!-- Tiny curled feet tucked under belly -->
  <g id="feet" stroke="#2f3542" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M 98 132 L 96 136 L 94 135"/>
    <path d="M 101 133 L 99 137 L 97 136"/>
  </g>
</svg>
